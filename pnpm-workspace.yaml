allowBuilds:
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
publicHoistPattern:
  - prettier
  - 'eslint'
  - '@commitlint/cli'
minimumReleaseAgeExclude:
  - pnpm
  - '@hyperupcall/markdownlint-config@0.5.2'
  - '@hyperupcall/npm-package-json-lint-config@0.2.0'
  - '@hyperupcall/scripts-nodejs@0.15.1 || 0.17.0'
  - '@hyperupcall/commitlint-config@0.2.0'
